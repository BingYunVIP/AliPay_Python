services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - pay_data:/app/data
      - ./secrets:/app/secrets:ro
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      BYPAY_DOMAIN: ${BYPAY_DOMAIN:-pay.bingyun.vip}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  callbacks:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "web.worker"]
    volumes:
      - pay_data:/app/data
      - ./secrets:/app/secrets:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pay_data:
  caddy_data:
  caddy_config:
