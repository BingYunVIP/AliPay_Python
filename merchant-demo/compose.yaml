services:
  merchant:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - demo_data:/app/data
      - ./secrets:/app/secrets:ro
    expose:
      - "8100"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:mode=1777"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    depends_on: [merchant]
volumes:
  demo_data:
  tls_data:
  tls_config:
