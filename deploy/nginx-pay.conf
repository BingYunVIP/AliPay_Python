server {
    listen 80;
    listen [::]:80;
    server_name pay.bingyun.vip;
    return 301 https://pay.bingyun.vip$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pay.bingyun.vip;
    ssl_certificate /etc/letsencrypt/live/pay.bingyun.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.bingyun.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
